<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f8f6f">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Baby Food Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <h1 id="day-badge">Baby Food Plan</h1>
  <button id="settings-btn" aria-label="Settings" class="icon-btn">⚙️</button>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button class="tab-btn" data-tab="today">📅<span>Today</span></button>
  <button class="tab-btn" data-tab="tracker">🥣<span>Tracker</span></button>
  <button class="tab-btn" data-tab="grocery">🛒<span>Grocery</span></button>
  <button class="tab-btn" data-tab="notes">📝<span>Notes</span></button>
</nav>

<div id="settings-modal" class="modal hidden">
  <div class="modal-card">
    <h2>Settings</h2>
    <label for="start-date-input">Baby's Day 1 date</label>
    <input type="date" id="start-date-input">
    <p class="hint">Day 1 = the first day of solid food introduction. Everything else is calculated from this date.</p>
    <div class="settings-actions">
      <button id="export-btn" class="btn">Export data (JSON)</button>
      <label class="btn" for="import-file">Import data (JSON)</label>
      <input type="file" id="import-file" accept="application/json" class="hidden-input">
    </div>
    <p class="hint">Export downloads a JSON file you can commit to your GitHub repo to back up or sync your tracked data across devices.</p>
    <button id="close-settings" class="btn btn-primary">Done</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
